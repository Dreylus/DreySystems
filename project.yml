name: AppleAppFactory
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UIFileSharingEnabled: NO
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
targets:
  Store:
    type: application
    platform: iOS
    sources: [Store, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoreh.personal.store
        INFOPLIST_KEY_CFBundleDisplayName: Store
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SmoreHub:
    type: application
    platform: iOS
    sources: [SmoreHub, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoreh.personal.smorehub
        INFOPLIST_KEY_CFBundleDisplayName: Smore Hub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Store:
    build:
      targets:
        Store: all
  SmoreHub:
    build:
      targets:
        SmoreHub: all
